apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-js
  namespace: app-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [hello.example.com]
      secretName: tls-wildcard-example
  rules:
    - host: hello.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-js
                port: { number: 80 }
