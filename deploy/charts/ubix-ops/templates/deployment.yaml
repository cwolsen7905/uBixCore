{{- if not .Values.gitlab.apiUrl }}
{{- fail "gitlab.apiUrl is required, e.g. https://gitlab.example.com/api/v4" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ubix-ops.fullname" . }}
  labels:
    {{- include "ubix-ops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ubix-ops.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ubix-ops.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: ubix-ops
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_NAME
              value: UbixOpsApi
            - name: GITLAB_API_URL
              value: {{ .Values.gitlab.apiUrl | quote }}
            - name: APPROVAL_JOB_NAMES
              value: {{ .Values.gitlab.approvalJobNames | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with (include "ubix-ops.secretName" .) }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
