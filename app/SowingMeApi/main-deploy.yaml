apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    field.cattle.io/creatorId: cwolsen
  labels:
    cattle.io/creator: norman
    workload.user.cattle.io/workloadselector: deployment-ws-prod-sowing-me-api
  name: sowing-me-api
  namespace: ws-prod
  selfLink: /apis/apps/v1/namespaces/ws-prod/deployments/sowing-me-api
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: deployment-ws-prod-sowing-me-api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        field.cattle.io/ports: '[[{"containerPort":8080,"dnsName":"sowing-me-api","hostPort":0,"kind":"ClusterIP","name":"8080tcp02","protocol":"TCP","sourcePort":0}]]'
        date: "{{DATE_STAMP}}"
      creationTimestamp: null
      labels:
        workload.user.cattle.io/workloadselector: deployment-ws-prod-sowing-me-api
    spec:
      containers:
      - env:
        - name: IN_DEV
          value: "0"
        - name: ENV
          value: "PROD"
        - name: APP_NAME
          value: "SowingMeApi"
        - name: VAULT_ADDR
          value: "https://vault.prod.ubixsys.com"
        - name: VAULT_K8S_ROLE
          value: "sowingme-prod"
        - name: VAULT_DB_STRATEGY
          value: "kv"
        - name: VAULT_DB_KV_PATH
          value: "sowingme/prod/db"
        - name: MYSQL_READ_HOST
          value: "10.50.25.45"
        - name: MYSQL_WRITE_HOST
          value: "10.50.25.45"
        image: gitlab.brainchurts.com:5050/ubixsys/ubixcore:main
        imagePullPolicy: Always
        name: sowing-me-api
        ports:
        - containerPort: 8080
          name: 8080tcp02
          protocol: TCP
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {}
          privileged: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
        stdin: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        tty: true
        volumeMounts:
        - mountPath: /log
          name: log
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: regcred
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - nfs:
          server: 10.50.0.1
          path: /data/nfs/logs
        name: log
